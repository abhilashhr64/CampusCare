name: CampusCare AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend Tests, RLS Introspection & Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: campuscare
          POSTGRES_USER: campuscare_admin
          POSTGRES_PASSWORD: AdminTestPassword123!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Roles (Forced RLS & Migrator)
        run: |
          PGPASSWORD="AdminTestPassword123!" psql -h localhost -U campuscare_admin -d campuscare -f backend/src/scripts/init_db_roles.sql

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          DB_MIGRATOR_URL: postgresql+psycopg://campuscare_migrator:CampusCareMigrateSecurePass2026!@localhost:5432/campuscare
          MIGRATION_DATABASE_URL: postgresql+psycopg://campuscare_migrator:CampusCareMigrateSecurePass2026!@localhost:5432/campuscare
        run: |
          alembic upgrade head

      - name: Run Full Test Suite (Catalog RLS, Boundaries, Auth Matrix & Pilot Journeys)
        working-directory: ./backend
        env:
          DB_APP_URL: postgresql+psycopg://campuscare_app:CampusCareAppSecurePass2026!@localhost:5432/campuscare
          DB_MIGRATOR_URL: postgresql+psycopg://campuscare_migrator:CampusCareMigrateSecurePass2026!@localhost:5432/campuscare
          DATABASE_URL: postgresql+psycopg://campuscare_app:CampusCareAppSecurePass2026!@localhost:5432/campuscare
          MIGRATION_DATABASE_URL: postgresql+psycopg://campuscare_migrator:CampusCareMigrateSecurePass2026!@localhost:5432/campuscare
          APP_SECRET_KEY: test_ci_jwt_session_secret_key_1234567890
        run: |
          pytest tests/ -v --junitxml=../docs/reports/pytest_ci_report.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Next.js Production Bundle (Turbopack)
        working-directory: ./frontend
        run: |
          npm run build

